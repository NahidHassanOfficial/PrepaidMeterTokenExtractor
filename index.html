<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="A simple prepaid meter token extraction program to extract tokens from text data." />
    
    <!-- PWA Settings -->
    <meta name="theme-color" content="#008b8b" id="meta-theme-color">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
    <style></style>
    <title>Prepaid Meter Token Extractor</title>
</head>

<body>
    <section>
        <div class="card-header">
            <div class="header-logo-group">
                <div class="header-icon-wrapper">
                    <i class="fa-solid fa-bolt-lightning card-header-icon"></i>
                </div>
                <div class="header-title-container">
                    <h2>Prepaid Meter</h2>
                    <span class="card-header-subtitle">Token Extractor</span>
                </div>
            </div>
            
            <div class="header-actions">
                <button id="pwa-install" class="pwa-install-btn hidden" aria-label="Install App" title="Install App">
                    <i class="fa-solid fa-download"></i>
                </button>
                <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme" title="Toggle Theme">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
        
        <!-- Instructions box -->
        <div class="instructions-box">
            <div class="instruction-title">
                <i class="fa-solid fa-circle-info"></i> How to use:
            </div>
            <ol>
                <li>Paste your meter SMS message below.</li>
                <li>Click <strong>PROCEED</strong> to extract the tokens.</li>
                <li>Navigate through tokens using <strong>Previous / Next</strong>.</li>
                <li>Click on the digits to copy, then enter on your meter.</li>
            </ol>
        </div>

        <div class="textarea-container">
            <i class="fa-solid fa-envelope-open-text textarea-icon"></i>
            <textarea placeholder="Enter your token message here and click to proceed..."></textarea>
        </div>
        <button class="submit"><i class="fa fa-play"></i>PROCEED</button>
        <div class="results"></div>
        <table></table>
    </section>

    <div class="notifications"></div>

    <script src="script.js"></script>
    <script>
        // Register PWA Service Worker for offline capability
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered successfully.'))
                    .catch(err => console.error('Service Worker registration failed:', err));
            });
        }
    </script>
</body>

</html>
