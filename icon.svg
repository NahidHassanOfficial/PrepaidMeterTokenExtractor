<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  
  <!-- Outer Meter Frame -->
  <rect x="120" y="100" width="272" height="312" rx="32" fill="#0f172a" stroke="#ffffff" stroke-width="8" opacity="0.9" />
  
  <!-- Digital Display Panel -->
  <rect x="144" y="132" width="224" height="96" rx="16" fill="#1e293b" stroke="#334155" stroke-width="4" />
  
  <!-- Digital Text Lines representing extracted tokens -->
  <rect x="168" y="152" width="176" height="12" rx="6" fill="#0ea5e9" opacity="0.8" />
  <rect x="168" y="172" width="176" height="12" rx="6" fill="#0ea5e9" opacity="0.8" />
  <rect x="168" y="192" width="120" height="12" rx="6" fill="#10b981" />
  
  <!-- Keypad dots representing meter keys -->
  <circle cx="176" cy="276" r="16" fill="#334155" />
  <circle cx="256" cy="276" r="16" fill="#334155" />
  <circle cx="336" cy="276" r="16" fill="#334155" />
  
  <circle cx="176" cy="326" r="16" fill="#334155" />
  <circle cx="256" cy="326" r="16" fill="#334155" />
  <circle cx="336" cy="326" r="16" fill="#334155" />
  
  <circle cx="176" cy="376" r="16" fill="#e11d48" /> <!-- Cancel Button -->
  <circle cx="256" cy="376" r="16" fill="#334155" />
  <circle cx="336" cy="376" r="16" fill="#16a34a" /> <!-- Enter Button -->

  <!-- Lightning Bolt for power energy symbol overlay -->
  <path d="M 270,110 L 230,220 L 265,220 L 242,320 L 300,185 L 265,185 Z" fill="url(#boltGrad)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.4))" />
</svg>
